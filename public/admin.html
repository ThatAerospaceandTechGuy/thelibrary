<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Admin — The Stacks</title>
<meta name="description" content="Admin tools for The Stacks: sync the textbook list with the shared Drive folder." />
<meta property="og:title" content="Admin — The Stacks" />
<meta property="og:description" content="Sync the textbook list with the shared Drive folder." />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">The <span>Stacks</span></a>
    <nav class="nav" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="textbooks.html">Textbooks</a>
      <a href="admin.html" aria-current="page">Admin</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="page-head">
      <h1>Admin</h1>
      <p class="lead">Pull the latest PDFs from the shared Drive folder and update the shelf.</p>
    </div>

    <div class="card">
      <form class="form" id="form" autocomplete="off">
        <div class="field">
          <label for="user">Username</label>
          <input id="user" name="user" type="text" required />
        </div>
        <div class="field">
          <label for="pass">Password</label>
          <input id="pass" name="pass" type="password" required />
        </div>
        <button class="btn" id="submit" type="submit">Sync now</button>
      </form>
      <div class="status" id="status" role="status" aria-live="polite" hidden></div>
      <p class="note" style="margin-top:20px">
        Syncing rewrites the textbook list and triggers a redeploy — the shelf updates a minute or two later.
      </p>
    </div>
  </div>
</main>

<script>
  const form = document.getElementById("form");
  const btn = document.getElementById("submit");
  const statusEl = document.getElementById("status");

  function setStatus(kind, text) {
    statusEl.hidden = false;
    statusEl.className = "status " + kind;
    statusEl.textContent = text;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = "Syncing…";
    setStatus("info", "Talking to Drive and updating the list…");

    try {
      const res = await fetch("/api/sync", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          user: document.getElementById("user").value,
          pass: document.getElementById("pass").value,
        }),
      });

      let data = {};
      try { data = await res.json(); } catch (_) {}

      if (res.status === 401) {
        setStatus("err", "Wrong username or password.");
      } else if (!res.ok) {
        setStatus("err", data.message || `Sync failed (${res.status}).`);
      } else {
        const count = data.count ?? 0;
        setStatus("ok", `Synced ${count} book${count === 1 ? "" : "s"}. The shelf will update once the site redeploys.`);
        document.getElementById("pass").value = "";
      }
    } catch (_) {
      setStatus("err", "Couldn't reach the sync service. Check your connection and try again.");
    } finally {
      btn.disabled = false;
      btn.textContent = "Sync now";
    }
  });
</script>
</body>
</html>
