<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Library — The Stacks</title>
<meta name="description" content="Browse every file in the shared library." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="index.html">The <span>Stacks</span></a>
    <nav class="nav" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="textbooks.html" aria-current="page">Library</a>
      <a href="admin.html">Admin</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="page-head">
      <div class="eyebrow">LIBRARY</div>
      <h1>All files</h1>
      <p class="lead">Everything in the shared Google Drive folder appears here. Open files in your browser or download them.</p>
    </div>

    <div class="table-card">
      <div class="table-scroll">
        <div id="state" class="state">Loading files…</div>
        <table id="table" hidden>
          <thead>
            <tr>
              <th class="book-col">Name</th>
              <th>Type</th>
              <th>Size</th>
              <th class="date">Date modified</th>
              <th class="action-col view-head">View</th>
              <th class="action-col download-head">Download</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
    <p class="meta" id="meta"></p>
  </div>
</main>

<script>
const stateEl = document.getElementById("state");
const tableEl = document.getElementById("table");
const rowsEl = document.getElementById("rows");
const metaEl = document.getElementById("meta");

const typeNames = {
  "application/pdf": "PDF",
  "application/vnd.google-apps.document": "Google Doc",
  "application/vnd.google-apps.spreadsheet": "Spreadsheet",
  "application/vnd.google-apps.presentation": "Presentation",
  "application/vnd.google-apps.folder": "Folder",
  "image/jpeg": "JPEG",
  "image/png": "PNG",
  "image/gif": "GIF",
  "text/plain": "Text",
  "text/csv": "CSV",
  "application/zip": "ZIP"
};

function fileType(mime) {
  if (typeNames[mime]) return typeNames[mime];
  if (!mime) return "File";
  const parts = mime.split("/");
  return parts.length > 1 ? parts[1].toUpperCase().replace(/^X-/, "") : "File";
}

function formatSize(bytes) {
  const n = Number(bytes);
  if (!Number.isFinite(n) || n <= 0) return "—";
  const units = ["B", "KB", "MB", "GB"];
  let i = 0, v = n;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return `${v < 10 && i > 0 ? v.toFixed(1) : Math.round(v)} ${units[i]}`;
}

function formatDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return isNaN(d) ? "—" : d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}

const eyeIcon = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>`;
const downloadIcon = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>`;

fetch("/api/books", { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
  .then(data => {
    const files = Array.isArray(data.books) ? data.books : [];
    if (!files.length) {
      stateEl.textContent = "No files found in the shared Drive folder.";
      return;
    }

    for (const b of files) {
      const tr = document.createElement("tr");

      const name = document.createElement("td");
      name.className = "name";
      const title = document.createElement("div");
      title.className = "book-title";
      title.textContent = b.name || "Untitled";
      name.appendChild(title);

      const type = document.createElement("td");
      type.className = "file-type";
      type.textContent = fileType(b.mimeType);

      const size = document.createElement("td");
      size.className = "num";
      size.textContent = formatSize(b.size);

      const date = document.createElement("td");
      date.className = "date";
      date.textContent = formatDate(b.dateModified);

      const view = document.createElement("td");
      view.className = "action-cell";
      const viewLink = document.createElement("a");
      viewLink.className = "btn btn-view";
      viewLink.href = b.viewUrl || "#";
      viewLink.target = "_blank";
      viewLink.rel = "noopener noreferrer";
      viewLink.innerHTML = eyeIcon + "<span>View</span>";
      viewLink.setAttribute("aria-label", `View ${b.name || "file"}`);
      view.appendChild(viewLink);

      const download = document.createElement("td");
      download.className = "action-cell";
      const downloadLink = document.createElement("a");
      downloadLink.className = "btn btn-download";
      downloadLink.href = b.downloadUrl || "#";
      downloadLink.rel = "noopener noreferrer";
      downloadLink.innerHTML = downloadIcon + "<span>Download</span>";
      downloadLink.setAttribute("aria-label", `Download ${b.name || "file"}`);
      download.appendChild(downloadLink);

      tr.append(name, type, size, date, view, download);
      rowsEl.appendChild(tr);
    }

    stateEl.hidden = true;
    tableEl.hidden = false;
    metaEl.textContent = `${files.length} file${files.length === 1 ? "" : "s"} · live from Google Drive`;
  })
  .catch(err => {
    console.error(err);
    stateEl.textContent = "Couldn't load the file list. Please refresh and try again.";
  });
</script>
</body>
</html>
